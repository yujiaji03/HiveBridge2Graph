# SQL文件夹路径
sql.folder.path=hive_filter

# Neo4j数据库连接配置
neo4j.uri=bolt://localhost:7687
neo4j.user=neo4j
neo4j.password=password123

# 日志级别 (TRACE, DEBUG, INFO, WARN, ERROR)
log.level=INFO

# SQL解析器配置 - 使用 Spark Catalyst 解析


# Spark 配置
# spark.master 控制线程池大小:
# local[1] = 使用1个线程
# local[2] = 使用2个线程  
# local[*] = 使用所有可用CPU核心
# local[4] = 使用4个线程
spark.app.name=HiveBridge2Graph-SQLParser
spark.master=local[*]
spark.sql.warehouse.dir=/tmp/spark-warehouse

# OpenLineage 配置
openlineage.url=http://localhost:5000
openlineage.namespace=hive-bridge-2-graph
openlineage.enabled=true
